[project]
name = "adb2c-pipeline"
version = "0.1.0"
description = "Pipeline de ingestão e refinamento de usuários do Azure AD B2C"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "azure-storage-blob==12.20.0",
    "cryptography==49.0.0",
    "msal>=1.34.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "pandera==0.19.3",
    "pyarrow==16.1.0",
    "python-dotenv==1.0.1",
    "rapidfuzz==3.9.3",
    "requests>=2.34.2",
    "snowflake-connector-python==4.6.0",
    "snowflake-sqlalchemy==1.10.2",
    "sqlalchemy==2.0.51",
    "tenacity==9.0.0",
]

[dependency-groups]
dev = [
    "pre-commit==3.7.1",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
